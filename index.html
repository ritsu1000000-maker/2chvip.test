<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  // ▼ getDoc を追加でインポートしています ▼
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  // Firebase設定
  const firebaseConfig = {
    apiKey: "AIzaSyBCQArL0Q1wDveRywCpet5Nor3PuRYt7fM",
    authDomain: "sabopennet.firebaseapp.com",
    projectId: "sabopennet",
    storageBucket: "sabopennet.firebasestorage.app",
    messagingSenderId: "284308308452",
    appId: "1:284308308452:web:e36dd991e55a0e60e4c7f1",
    measurementId: "G-K17XRK5KRN"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const pollsCollection = collection(db, "user_polls");
  const q = query(pollsCollection, orderBy("createdAt", "desc"));

  let myVotes = JSON.parse(localStorage.getItem('myPollVotes')) || {};

  // リアルタイム受信（画面表示）
  onSnapshot(q, (snapshot) => {
    const listEl = document.getElementById('polls-list');
    listEl.innerHTML = '';

    if (snapshot.empty) {
      listEl.innerHTML = '<p style="color:#999; text-align:center;">まだ投稿はありません。</p>';
      return;
    }

    snapshot.forEach((docSnap) => {
      const poll = docSnap.data();
      const id = docSnap.id;
      
      const options = poll.options || [];
      const votes = poll.votes || [];
      const totalVotes = votes.reduce((a, b) => a + b, 0);

      let dateStr = "";
      if (poll.createdAt) {
        const date = poll.createdAt.toDate();
        dateStr = `${date.getFullYear()}/${date.getMonth()+1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
      }

      const authorName = poll.name ? escapeHTML(poll.name) : "名無しさん";
      const bodyHTML = poll.body ? `<div class="poll-body-text">${escapeHTML(poll.body)}</div>` : "";

      const pollEl = document.createElement('div');
      pollEl.className = 'poll-item';
      
      let optionsHTML = '';
      if (options.length > 0) {
        optionsHTML += '<div class="poll-options-box">';
        options.forEach((opt, idx) => {
          const optVotes = votes[idx] || 0;
          const percent = totalVotes > 0 ? Math.round((optVotes / totalVotes) * 100) : 0;
          const isMyVote = myVotes[id] === idx;
          const wrapperClass = isMyVote ? "poll-option-wrapper voted" : "poll-option-wrapper";

          optionsHTML += `
            <div class="${wrapperClass}" onclick="castVote('${id}', ${idx})">
              <div class="poll-bar" style="width: ${percent}%"></div>
              <div class="poll-option-clickarea">
                <span class="vote-text">${isMyVote ? '🔵 ' : ''}${escapeHTML(opt)}</span>
                <span class="vote-count">${optVotes}票 (${percent}%)</span>
              </div>
            </div>
          `;
        });
        optionsHTML += '</div>';
      }

      const voteMeta = options.length > 0 ? ` | 総投票数: ${totalVotes}票` : '';

      pollEl.innerHTML = `
        <div class="poll-question">💡 ${escapeHTML(poll.title)}</div>
        <div class="poll-meta">提案者: <span class="poll-name">${authorName}</span> | 提案日時: ${dateStr}${voteMeta}</div>
        ${bodyHTML}
        ${optionsHTML}
      `;
      listEl.appendChild(pollEl);
    });
  });

  // 新規投稿処理
  document.getElementById('poll-create-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerText = "送信中...";

    const nameInput = document.getElementById('poll-name').value.trim();
    const titleInput = document.getElementById('poll-title').value.trim();
    const bodyInput = document.getElementById('poll-body').value.trim();
    const optionsInput = document.getElementById('poll-options').value;
    const authorName = nameInput || "名無しさん";

    const optionsArray = optionsInput ? optionsInput.split(',').map(o => o.trim()).filter(o => o !== "") : [];

    if (optionsArray.length === 1) {
      alert("アンケートを作成する場合は、選択肢を2つ以上入力してください。");
      btn.disabled = false;
      btn.innerText = "投稿する";
      return;
    }

    try {
      await addDoc(pollsCollection, {
        name: authorName,
        title: titleInput,
        body: bodyInput,
        options: optionsArray,
        votes: optionsArray.length > 0 ? new Array(optionsArray.length).fill(0) : [],
        createdAt: serverTimestamp()
      });

      await fetch("https://formspree.io/f/xnjrejan", {
        method: "POST",
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          "お名前": authorName,
          "タイトル": titleInput,
          "詳しい内容": bodyInput || "（入力なし）",
          "アンケート選択肢": optionsArray.length > 0 ? optionsArray.join(" / ") : "なし"
        })
      });

      this.reset();
    } catch (error) {
      console.error(error);
      alert("投稿またはメール送信に失敗しました。");
    } finally {
      btn.disabled = false;
      btn.innerText = "投稿する";
    }
  });

  // ▼ 修正部分：投票実行処理（getDoc を使用して安全に更新するようにしました） ▼
  window.castVote = async function(pollId, optionIndex) {
    const pollRef = doc(db, "user_polls", pollId);
    
    try {
      // データベースから最新の状態を1回だけ取得する
      const docSnap = await getDoc(pollRef);
      if (!docSnap.exists()) return;

      const data = docSnap.data();
      let currentVotes = [...data.votes];
      const previousVoteIdx = myVotes[pollId];

      if (previousVoteIdx === optionIndex) {
        // 同じ選択肢を押した場合は取り消し
        currentVotes[optionIndex] = Math.max(0, currentVotes[optionIndex] - 1);
        delete myVotes[pollId];
      } else {
        // 別の選択肢を押した場合、または初めての投票
        if (previousVoteIdx !== undefined) {
          currentVotes[previousVoteIdx] = Math.max(0, currentVotes[previousVoteIdx] - 1);
        }
        currentVotes[optionIndex] = (currentVotes[optionIndex] || 0) + 1;
        myVotes[pollId] = optionIndex;
      }

      // 自分の投票状態をブラウザに保存
      localStorage.setItem('myPollVotes', JSON.stringify(myVotes));

      // データベースを更新
      await updateDoc(pollRef, { votes: currentVotes });
      
    } catch (e) {
      console.error("投票エラー:", e);
    }
  };

  function escapeHTML(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
</script>
